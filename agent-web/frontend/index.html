<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indra IA</title>
  <link rel="icon" type="image/x-icon" href="sharingan indra.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="sharingan indra.ico" class="logo-img" />
      <span class="logo-text">Indra IA</span>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="🔍 Rechercher..." autocomplete="off" />
      <div id="searchResults" class="search-dropdown"></div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">+ Nouvelle conversation</button>

    <div class="sidebar-section">
      <span>Projets</span>
      <button id="newProjectBtn" class="icon-btn" title="Nouveau projet">+</button>
    </div>
    <ul id="projectsList" class="sidebar-list"></ul>

    <div class="sidebar-section"><span>Conversations</span></div>
    <ul id="convList" class="sidebar-list conv-list"></ul>

    <div class="sidebar-footer">
      <span id="statusDot" class="status-dot offline"></span>
      <span id="statusText">Connexion...</span>
    </div>
  </aside>

  <main class="main">
    <div class="chat-header">
      <span id="chatTitle">Indra IA</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <textarea id="inputField" placeholder="Tape ta question... (Entrée pour envoyer, Shift+Entrée pour sauter une ligne)" rows="1"></textarea>
      <button id="sendBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="bg.js"></script>
</body>
</html>
